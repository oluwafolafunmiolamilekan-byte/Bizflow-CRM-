<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BizFlow CRM</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
font-family:Arial,sans-serif;
background:#f5f7fb;
color:#172033;
}

button,input,select,textarea{
font:inherit;
}

button{
cursor:pointer;
}

.hidden{
display:none!important;
}

/* AUTH */

.auth{
min-height:100vh;
display:grid;
place-items:center;
padding:20px;
}

.authbox{
width:min(430px,100%);
background:white;
padding:30px;
border-radius:18px;
box-shadow:0 8px 30px #0001;
}

.logo{
font-size:25px;
font-weight:800;
}

.logo span{
color:#2563eb;
}

.muted{
color:#6b7280;
font-size:14px;
}

.field{
margin:13px 0;
}

.field label{
display:block;
font-size:13px;
font-weight:bold;
margin-bottom:6px;
}

.input{
width:100%;
padding:11px;
border:1px solid #d5dae3;
border-radius:9px;
}

.primary{
background:#2563eb;
color:white;
border:0;
padding:11px 15px;
border-radius:9px;
font-weight:bold;
}

.full{
width:100%;
}

.link{
color:#2563eb;
font-weight:bold;
cursor:pointer;
}

/* APP */

.side{
position:fixed;
inset:0 auto 0 0;
width:235px;
background:#111827;
padding:22px 14px;
color:#ccd5e5;
}

.side .logo{
color:white;
margin:5px 10px 28px;
}

.nav button{
display:block;
width:100%;
border:0;
background:transparent;
color:#bdc7d8;
text-align:left;
padding:12px;
border-radius:9px;
margin:5px 0;
}

.nav button.active,
.nav button:hover{
background:#243047;
color:white;
}

.logout{
position:absolute;
bottom:20px;
left:14px;
right:14px;
width:calc(100% - 28px);
padding:11px;
border:0;
border-radius:9px;
background:#202a3d;
color:white;
}

.main{
margin-left:235px;
padding:24px;
}

.top{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:20px;
}

.top h1{
margin:0;
}

.cards{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:14px;
}

.card,
.panel{
background:white;
border-radius:15px;
padding:18px;
box-shadow:0 5px 22px #0000000b;
}

.big{
font-size:27px;
font-weight:800;
margin-top:8px;
}

.grid{
display:grid;
grid-template-columns:2fr 1fr;
gap:15px;
margin-top:15px;
}

.section{
display:none;
}

.section.active{
display:block;
}

.toolbar{
display:flex;
gap:10px;
margin-bottom:14px;
}

table{
width:100%;
border-collapse:collapse;
}

th,
td{
text-align:left;
padding:11px 7px;
border-bottom:1px solid #e5e7eb;
font-size:14px;
}

th

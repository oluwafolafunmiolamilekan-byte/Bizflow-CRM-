<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#101827">
<title>BizFlow CRM</title>
<style>
:root{--blue:#3563e9;--ink:#172033;--muted:#687386;--line:#e3e8f0;--bg:#f4f7fb}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Arial,sans-serif;color:var(--ink);background:var(--bg)}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.hidden{display:none!important}
.btn{border:0;border-radius:10px;padding:11px 15px;font-weight:700}
.primary{background:var(--blue);color:white}
.light{background:#edf1f8;color:#243149}
.danger{background:#fff0ee;color:#ad352a}
.notice{padding:12px;border-radius:10px;font-size:13px;line-height:1.45;margin:12px 0;background:#fff0ee;color:#9f2c22}
.success{background:#e8f8ef;color:#116943}
.auth{min-height:100vh;display:grid;place-items:center;padding:20px;background:linear-gradient(135deg,#101827,#233967)}
.card{background:white;border:1px solid var(--line);border-radius:18px;padding:24px;box-shadow:0 12px 35px #10204012}
.auth .card{width:min(100%,430px);padding:30px}
.brand{font-weight:850;font-size:22px;display:flex;align-items:center;gap:10px}
.logo{display:grid;place-items:center;background:var(--blue);color:#fff;border-radius:12px;width:40px;height:40px}
.muted{color:var(--muted);font-size:13px}
.field{display:flex;flex-direction:column;gap:7px;margin:14px 0}
.field label{font-size:13px;font-weight:700}
.field input,.field select,.field textarea,.toolbar input{width:100%;padding:12px;border:1px solid #d7deea;border-radius:9px;background:white}
.block{width:100%}
.switch{text-align:center;margin-top:17px;font-size:13px;color:var(--muted)}
.link{border:0;background:none;color:var(--blue);font-weight:800}
.topbar{height:66px;background:white;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 22px;position:sticky;top:0;z-index:3}
.topbar .brand{font-size:18px}
.topbar .logo{width:34px;height:34px}
.layout{display:grid;grid-template-columns:215px 1fr;min-height:calc(100vh - 66px)}
aside{background:white;border-right:1px solid var(--line);padding:14px}
.nav{display:block;width:100%;text-align:left;border:0;background:transparent;border-radius:9px;padding:12px;margin:3px 0;color:#536075;font-weight:700}
.nav.active,.nav:hover{background:#edf2ff;color:var(--blue)}
main{padding:25px;max-width:1500px;width:100%;margin:auto}
.head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:20px}
.head h1{font-size:27px;margin:0 0 5px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:13px;margin-bottom:18px}
.stat{background:white;border:1px solid var(--line);border-radius:14px;padding:17px}
.stat .num{font-size:24px;font-weight:850;margin-top:8px}
.panel{background:white;border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:18px}
.panel h2{font-size:17px;margin:0 0 14px}
.toolbar{display:flex;gap:10px;margin-bottom:12px}
.toolbar input{max-width:360px}
.tablewrap{overflow:auto}
table{border-collapse:collapse;width:100%;min-width:620px}
th,td{text-align:left;padding:12px 10px;border-bottom:1px solid #edf0f5;font-size:13px}
th{color:#8490a3;font-size:11px;text-transform:uppercase}
td{color:#354156}
.badge{display:inline-block;padding:4px 8px;border-radius:20px;background:#edf2ff;color:#3154b7;font-size:11px;font-weight:800}
.actions{display:flex;gap:5px}
.mini{border:0;border-radius:7px;padding:6px 8px;background:#edf1f8;font-size:11px;font-weight:800}
.mini.del{background:#fff0ee;color:#a33}
.empty{text-align:center;padding:30px;color:var(--muted)}
.rows{display:grid;grid-template-columns:1fr 1fr;gap:15px}
.row{padding:11px 0;border-bottom:1px solid #edf0f5;font-size:13px;display:flex;justify-content:space-between;gap:12px}
.modalbg{position:fixed;inset:0;background:#111b2c99;display:grid;place-items:center;padding:15px;z-index:9}
.modal{background:white;border-radius:16px;padding:22px;width:min(100%,520px);max-height:90vh;overflow:auto}
.modalhead{display:flex;justify-content:space-between;align-items:center}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.span{grid-column:1/-1}
.right{display:flex;gap:8px}
.foot{font-size:12px;color:var(--muted);margin-top:18px}
@media(max-width:850px){
.layout{grid-template-columns:1fr}
aside{display:flex;overflow:auto;padding:8px;border-right:0;border-bottom:1px solid var(--line)}
.nav{white-space:nowrap;width:auto}
.stats{grid-template-columns:1fr 1fr}
main{padding:16px}
.rows{grid-template-columns:1fr}
}
@media(max-width:520px){
.topbar{padding:0 12px}
.topbar .muted{display:none}
main{padding:12px}
.head{align-items:flex-start;flex-direction:column}
.head h1{font-size:23px}
.stats{gap:8px}
.stat{padding:12px}
.stat .num{font-size:20px}
.panel{padding:13px}
.grid{grid-template-columns:1fr}
.span{grid-column:auto}
.auth .card{padding:23px}
}
</style>
</head>
<body>

<section id="authScreen" class="auth">
<div class="card">
<div class="brand"><span class="logo">B</span> BizFlow CRM</div>
<h1 id="authTitle">Welcome back</h1>
<p class="muted" id="authSub">Sign in to manage your business.</p>
<div id="authNotice" class="notice hidden" role="status"></div>
<form id="authForm">
<div id="businessWrap" class="field hidden">
<label for="businessName">Business name</label>
<input id="businessName" autocomplete="organization">
</div>
<div class="field">
<label for="email">Email address</label>
<input id="email" type="email" autocomplete="email" required>
</div>
<div class="field">
<label for="password">Password (at least 6 characters)</label>
<input id="password" type="password" minlength="6" autocomplete="current-password" required>
</div>
<button id="authButton" class="btn primary block" type="submit">Sign in</button>
</form>
<div class="switch">
<span id="switchText">New to BizFlow?</span>
<button id="switchAuth" class="link" type="button">Create account</button>
</div>
<p class="foot">Your CRM records are saved online in your account.</p>
</div>
</section>

<section id="appScreen" class="hidden">
<header class="topbar">
<div class="brand"><span class="logo">B</span> BizFlow CRM</div>
<div class="right">
<span id="accountEmail" class="muted"></span>
<button id="logout" class="btn light" type="button">Log out</button>
</div>
</header>
<div class="layout">
<aside>
<button class="nav active" data-page="dashboard">▦ Dashboard</button>
<button class="nav" data-page="customers">♙ Customers</button>
<button class="nav" data-page="leads">◉ Leads</button>
<button class="nav" data-page="deals">◇ Deals</button>
<button class="nav" data-page="tasks">✓ Tasks</button>
</aside>
<main id="main"></main>
</div>
</section>

<div id="modalBg" class="modalbg hidden">
<div class="modal">
<div class="modalhead">
<h2 id="modalTitle">Add record</h2>
<button id="closeModal" class="btn light" type="button">×</button>
</div>
<form id="recordForm">
<div id="modalFields"></div>
<div id="modalError" class="notice hidden"></div>
<div class="right" style="justify-content:flex-end;margin-top:15px">
<button id="cancelModal" class="btn light" type="button">Cancel</button>
<button id="saveButton" class="btn primary" type="submit">Save</button>
</div>
</form>
</div>
</div>

<div id="toast" class="notice hidden" role="status" style="position:fixed;right:14px;bottom:14px;z-index:12;max-width:calc(100vw - 28px);box-shadow:0 8px 30px #0002"></div>

<script>
(function(){
"use strict";

const URL="https://khezivizitkogibbrfgs.supabase.co";
const KEY="sb_publishable_jvj02hNdZnYq9bjr8U7f8Q_1sr0Maq9";

const $=id=>document.getElementById(id);

const S={
db:null,
user:null,
mode:"signin",
page:"dashboard",
search:"",
customers:[],
leads:[],
deals:[],
tasks:[],
type:null,
editId:null
};

const defs={
customer:{
table:"customers",
list:"customers",
title:"Customer",
fields:[
["name","Full name","text",true],
["company","Company","text"],
["phone","Phone number","text"],
["email","Email","email"],
["notes","Notes","textarea",false,true]
]
},
lead:{
table:"leads",
list:"leads",
title:"Lead",
fields:[
["name","Full name","text",true],
["phone","Phone number","text"],
["email","Email","email"],
["source","Source","text"],
["status","Status","select",false,false,["New","Contacted","Qualified","Converted","Lost"]],
["notes","Notes","textarea",false,true]
]
},
deal:{
table:"deals",
list:"deals",
title:"Deal",
fields:[
["title","Deal title","text",true],
["customer","Customer name","text"],
["amount","Amount (₦)","number",true],
["status","Status","select",false,false,["Open","Proposal","Negotiation","Won","Lost"]]
]
},
task:{
table:"tasks",
list:"tasks",
title:"Task",
fields:[
["title","Task title","text",true],
["due_date","Due date","date"],
["completed","Status","select",false,false,["Pending","Completed"]]
]
}
};

const pageInfo={
dashboard:["Dashboard","An overview of your business activity",null],
customers:["Customers","Keep customer contact details organized","customer"],
leads:["Leads","Track potential customers and follow-ups","lead"],
deals:["Deals","Monitor sales opportunities and deal values","deal"],
tasks:["Tasks","Keep track of your daily work","task"]
};

function esc(v){
return String(v??"").replace(/[&<>"']/g,c=>({
"&":"&amp;",
"<":"&lt;",
">":"&gt;",
'"':"&quot;",
"'":"&#39;"
}[c]));
}

function money(v){
return new Intl.NumberFormat("en-NG",{
style:"currency",
currency:"NGN",
maximumFractionDigits:2
}).format(Number(v||0));
}

function date(v){
if(!v)return "—";
let d=new Date(String(v).length===10?v+"T00:00:00":v);
return isNaN(d)?esc(v):d.toLocaleDateString("en-NG",{
day:"numeric",
month:"short",
year:"numeric"
});
}

function note(el,msg,success){
el.textContent=msg;
el.className="notice"+(success?" success":"");
el.classList.remove("hidden");
}

function toast(msg,success){
note($("toast"),msg,success);
clearTimeout(toast.timer);
toast.timer=setTimeout(()=>$("toast").classList.add("hidden"),6500);
}

function errText(e){
let m=e?.message||String(e||"Unknown error");
if(/Invalid login credentials/i.test(m))return "Email or password is incorrect. Confirm your email if you just registered.";
if(/Email not confirmed/i.test(m))return "Please confirm your email using the link Supabase sent you.";
if(/already registered/i.test(m))return "This email already has an account. Switch to Sign in.";
if(/fetch|network/i.test(m))return "Could not reach Supabase. Check internet connection and project settings.";
return m;
}

function setMode(mode){
S.mode=mode;
let up=mode==="signup";
$("authTitle").textContent=up?"Create your account":"Welcome back";
$("authSub").textContent=up?"Create your business workspace.":"Sign in to manage your business.";
$("businessWrap").classList.toggle("hidden",!up);
$("businessName").required=up;
$("password").autocomplete=up?"new-password":"current-password";
$("authButton").textContent=up?"Create account":"Sign in";
$("switchText").textContent=up?"Already have an account?":"New to BizFlow?";
$("switchAuth").textContent=up?"Sign in":"Create account";
$("authNotice").classList.add("hidden");
}

$("switchAuth").onclick=()=>setMode(S.mode==="signin"?"signup":"signin");

$("authForm").addEventListener("submit",async e=>{
e.preventDefault();
$("authNotice").classList.add("hidden");

if(!S.db){
note($("authNotice"),"Supabase has not loaded. Check your connection and refresh the page.");
return;
}

let email=$("email").value.trim();
let password=$("password").value;
let business=$("businessName").value.trim();
let b=$("authButton");

if(S.mode==="signup"&&!business){
note($("authNotice"),"Enter your business name.");
return;
}

b.disabled=true;
b.textContent=S.mode==="signup"?"Creating account…":"Signing in…";

try{
if(S.mode==="signup"){
let {data,error}=await S.db.auth.signUp({
email,
password,
options:{data:{business_name:business}}
});

if(error)throw error;

if(data.session){
S.user=data.user;
await enterApp();
}else{
note($("authNotice"),"Account created. Check your email for a confirmation link, then sign in.",true);
$("email").value=email;
setMode("signin");
}
}else{
let {data,error}=await S.db.auth.signInWithPassword({email,password});
if(error)throw error;
S.user=data.user;
await enterApp();
}
}catch(e){
note($("authNotice"),errText(e));
}finally{
b.disabled=false;
b.textContent=S.mode==="signup"?"Create account":"Sign in";
}
});

async function loadLibrary(){
if(window.supabase?.createClient)return window.supabase;

for(const src of [
"https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2",
"https://unpkg.com/@supabase/supabase-js@2"
]){
try{
await new Promise((resolve,reject)=>{
let s=document.createElement("script");
s.src=src;
s.async=true;
s.onload=resolve;
s.onerror=()=>{
s.remove();
reject(Error("CDN failed"));
};
document.head.appendChild(s);
});

if(window.supabase?.createClient)return window.supabase;
}catch(e){}
}

throw Error("Supabase library did not load. Check your internet connection.");
}

async function boot(){
try{
let lib=await loadLibrary();
S.db=lib.createClient(URL,KEY);

let {data,error}=await S.db.auth.getSession();
if(error)throw error;

if(data.session?.user){
S.user=data.session.user;
await enterApp();
}

S.db.auth.onAuthStateChange((event,session)=>{
if(event==="SIGNED_OUT"){
S.user=null;
$("appScreen").classList.add("hidden");
$("authScreen").classList.remove("hidden");
}else if(session?.user){
S.user=session.user;
}
});
}catch(e){
note($("authNotice"),"Startup error: "+errText(e));
}
}

async function enterApp(){
$("authScreen").classList.add("hidden");
$("appScreen").classList.remove("hidden");
$("accountEmail").textContent=S.user?.email||"";
await loadData();
render();
}

$("logout").onclick=async()=>{
let {error}=await S.db.auth.signOut();
if(error){
toast(errText(error));
return;
}

S.user=null;
S.customers=[];
S.leads=[];
S.deals=[];
S.tasks=[];

$("appScreen").classList.add("hidden");
$("authScreen").classList.remove("hidden");
$("password").value="";
setMode("signin");
};

async function loadData(){
if(!S.user)return;

for(let table of ["customers","leads","deals","tasks"]){
let {data,error}=await S.db.from(table)
.select("*")
.order("created_at",{ascending:false});

if(error){
toast("Loading "+table+" failed: "+error.message+". Check the Supabase table and RLS policies.");
return;
}

S[table]=data||[];
}
}

document.querySelectorAll("[data-page]").forEach(b=>{
b.onclick=()=>{
S.page=b.dataset.page;
S.search="";
document.querySelectorAll("[data-page]").forEach(n=>{
n.classList.toggle("active",n===b);
});
render();
};
});

function render(){
let [title,desc,type]=pageInfo[S.page];
let business=S.user?.user_metadata?.business_name||"Your business";

let h=`<div class="head">
<div>
<h1>${esc(title)}</h1>
<div class="muted">${esc(desc)} · ${esc(business)}</div>
</div>
${type?`<button class="btn primary" id="add">+ Add ${type}</button>`:`<button class="btn light" id="refresh">↻ Refresh data</button>`}
</div>`;

if(S.page==="dashboard")h+=dashboard();
else h+=tablePage(S.page);

$("main").innerHTML=h;

if($("add"))$("add").onclick=()=>openModal(type);

if($("refresh"))$("refresh").onclick=async()=>{
await loadData();
render();
toast("Data refreshed.",true);
};

if($("search"))$("search").oninput=e=>{
S.search=e.target.value;
let p=$("tableArea");
p.innerHTML=tableRows(S.page);
rowEvents();
$("search").focus();
};

rowEvents();
}

function dashboard(){
let open=S.deals.filter(x=>!/(won|lost|closed)/i.test(x.status||""));
let pipeline=open.reduce((a,x)=>a+Number(x.amount||0),0);
let won=S.deals.filter(x=>/won/i.test(x.status||"")).reduce((a,x)=>a+Number(x.amount||0),0);
let done=S.tasks.filter(x=>x.completed).length;

return `<div class="stats">
<div class="stat"><div class="muted">Total customers</div><div class="num">${S.customers.length}</div></div>
<div class="stat"><div class="muted">Active leads</div><div class="num">${S.leads.filter(x=>!/(won|lost|converted)/i.test(x.status||"")).length}</div></div>
<div class="stat"><div class="muted">Open pipeline</div><div class="num" style="font-size:20px">${money(pipeline)}</div></div>
<div class="stat"><div class="muted">Tasks completed</div><div class="num">${done}/${S.tasks.length}</div></div>
</div>

<div class="rows">
<section class="panel">
<h2>Recent customers</h2>
${S.customers.slice(0,5).map(x=>`<div class="row">
<span><b>${esc(x.name)}</b><br>
<span class="muted">${esc(x.company||x.email||x.phone||"No extra details")}</span></span>
<span class="muted">${date(x.created_at)}</span>
</div>`).join("")||`<div class="empty">No customers yet. Add your first customer.</div>`}
</section>

<section class="panel">
<h2>Sales snapshot</h2>
<div class="row"><span>Won deals</span><b>${money(won)}</b></div>
<div class="row"><span>Open deal value</span><b>${money(pipeline)}</b></div>
<div class="row"><span>Open tasks</span><b>${S.tasks.length-done}</b></div>
<div class="row"><span>Leads in progress</span><b>${S.leads.filter(x=>!/(won|lost|converted)/i.test(x.status||"")).length}</b></div>
</section>
</div>

<section class="panel">
<h2>Quick actions</h2>
<div class="right" style="flex-wrap:wrap">
${["customer","lead","deal","task"].map(t=>`<button class="btn ${t==="customer"?"primary":"light"}" data-add="${t}">+ Add ${t}</button>`).join("")}
</div>
</section>`;
}

const cols={
customers:[["name","Name"],["company","Company"],["phone","Phone"],["email","Email"],["created_at","Added"]],
leads:[["name","Name"],["source","Source"],["status","Status"],["phone","Phone"],["created_at","Added"]],
deals:[["title","Deal"],["customer","Customer"],["amount","Amount"],["status","Status"],["created_at","Added"]],
tasks:[["title","Task"],["due_date","Due date"],["completed","Status"],["created_at","Created"]]
};

function tablePage(page){
return `<section class="panel">
<div class="toolbar">
<input id="search" type="search" placeholder="Search ${page}…" value="${esc(S.search)}">
<span class="muted" style="align-self:center">${S[page].length} record(s)</span>
</div>
<div id="tableArea" class="tablewrap">${tableRows(page)}</div>
</section>`;
}

function tableRows(page){
let arr=S[page]||[];
let q=S.search.toLowerCase();

arr=arr.filter(r=>!q||Object.values(r).some(v=>String(v??"").toLowerCase().includes(q)));

if(!arr.length){
return `<div class="empty">${S[page].length?"No matching records.":"Nothing here yet. Add your first record."}</div>`;
}

return `<table>
<thead><tr>${cols[page].map(c=>`<th>${c[1]}</th>`).join("")}<th>Actions</th></tr></thead>
<tbody>
${arr.map(r=>`<tr>
${cols[page].map(([k])=>`<td>${cell(k,r[k])}</td>`).join("")}
<td><div class="actions">
<button class="mini" data-edit="${esc(r.id)}" data-type="${page.slice(0,-1)}">Edit</button>
<button class="mini del" data-delete="${esc(r.id)}" data-type="${page.slice(0,-1)}">Delete</button>
</div></td>
</tr>`).join("")}
</tbody>
</table>`;
}

function cell(k,v){
if(k==="amount")return "<b>"+money(v)+"</b>";
if(k==="created_at"||k==="due_date")return date(v);
if(k==="completed")return `<span class="badge">${v?"Completed":"Pending"}</span>`;
if(k==="status")return `<span class="badge">${esc(v||"New")}</span>`;
return esc(v||"—");
}

function rowEvents(){
document.querySelectorAll("[data-add]").forEach(b=>{
b.onclick=()=>openModal(b.dataset.add);
});

document.querySelectorAll("[data-edit]").forEach(b=>{
b.onclick=()=>openModal(b.dataset.type,b.dataset.edit);
});

document.querySelectorAll("[data-delete]").forEach(b=>{
b.onclick=()=>del(b.dataset.type,b.dataset.delete);
});
}

function openModal(type,id){
let d=defs[type];
if(!d)return;

S.type=type;
S.editId=id||null;

let old=id?S[d.list].find(x=>String(x.id)===String(id)):null;

$("modalTitle").textContent=(old?"Edit ":"Add ")+d.title;
$("modalError").classList.add("hidden");

$("modalFields").innerHTML=`<div class="grid">${d.fields.map(f=>{
let [k,label,kind,required,span,options]=f;
let val=old?old[k]:(k==="status"?(type==="lead"?"New":"Open"):k==="amount"?0:k==="completed"?false:"");

if(k==="completed")val=val?"Completed":"Pend
